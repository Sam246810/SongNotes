<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SongNotes — A text editor built for songwriters. Write lyrics and chords effortlessly." />
    <title>SongNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Applied before first paint, before React loads src/utils/theme.js (which owns the
      // preference) — otherwise the page paints light first and flips once the app runs.
      // Mirrors theme.js: nothing saved means 'system'. Must run here (start of body),
      // not in <head>, since document.body doesn't exist yet up there.
      try {
        var t = localStorage.getItem('songnotes-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.body.classList.add('cozy-dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
